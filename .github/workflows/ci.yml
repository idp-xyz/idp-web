name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests and the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Known vulnerabilities in the dependencies and the standard library (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Format, vet, unit tests
        run: make test
      - name: Image builds
        run: bash deploy/build.sh idp-web:ci
      - name: Image vulnerabilities (trivy, HIGH and CRITICAL with a fix fail the build)
        run: |
          bash deploy/pull-image.sh ghcr.io/aquasecurity/trivy:0.76.2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 idp-web:ci
