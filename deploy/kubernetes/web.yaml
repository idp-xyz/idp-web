# The idp-web service. It keeps its daily quotas and the numbers [n] of the sources a caller has been shown in PostgreSQL
# (ADR-0001 D28, D29), so it may run as MORE THAN ONE replica, as long as the database is configured, which as shipped it is
# (the Secret idp-web-database below): the count and the numbering are the database's, the same for every pod and across
# restarts. What is still per pod: the read cache (performance only, D21) and the sliding-window rate limit (D22): with N
# replicas a caller can make up to N times the window's calls, and the daily quota is the exact bound. Nothing else forbids
# more than one replica; `replicas` is left at 1 for the operator to raise. RollingUpdate, because two pods at the same time are
# no longer a problem (it was one of the reasons for Recreate before the database).
# Without a database (no IDP_WEB_DATABASE_URL_FILE, not what this file ships) the numbering is in memory and per pod, no
# daily limit can be set, and the service must be ONE replica with strategy Recreate: two pods would give the same caller two
# numberings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-web
  namespace: idp-web
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 1                                    # more than one is fine with the database (see above)
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false         # it never talks to the Kubernetes API
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10580
        runAsGroup: 10580
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: idp-web
          ports:
            - name: mcp
              containerPort: 8580
            - name: ops
              containerPort: 9580
          env:
            - name: IDP_WEB_LISTEN
              value: "0.0.0.0:8580"
            - name: IDP_WEB_PRIVATE_NETWORK         # the NetworkPolicy lets only the idp-mcp gateway and registry reach it
              value: "true"
            - name: IDP_WEB_METRICS
              value: "0.0.0.0:9580"
            # The gateway's signature over the caller (ADR-0001 D2): every tools/call must carry it, made for THIS endpoint, which
            # is the URL the Service has once registered at the gateway (identity=forward). It must be the same text as the
            # registered endpoint, character for character (docs/RUNBOOK.md).
            - name: IDP_WEB_CALLER_KEYS_FILE
              value: /etc/idp/gateway/caller.pub
            - name: IDP_WEB_CALLER_AUDIENCE
              value: "http://idp-web.idp-web.svc.cluster.local:8580/mcp"
            - name: IDP_WEB_REF_KEY_FILE
              value: /etc/idp/ref/ref.key
            - name: IDP_WEB_TENANTS_FILE
              value: /etc/idp/tenants/tenants.yaml
            # The database of the daily quotas and the source numbers. The Secret idp-web-database (the operator's) holds the
            # URL of the service's login role, a member of idp_web_app and never a superuser, as service-url, and the CA that
            # signed the server's certificate as ca.crt. TLS is the URL's: sslmode=verify-full&sslrootcert=/etc/idp/database/ca.crt
            # (docs/RUNBOOK.md 9). The schema is prepared by the Job idp-web-migrate first; idp-web refuses to start on a schema
            # that is not at the version it needs.
            - name: IDP_WEB_DATABASE_URL_FILE
              value: /etc/idp/database/service-url
            # THE SEARCH PROVIDER IS THE OPERATOR'S CHOICE and is not set here. It decides who is sent every query the agents make
            # (platform ADR-0003 D3), in which region, under whose terms, at what price: not a default to ship. Without it the
            # service exits at start with status 2 and says why, and the pod stays unready: it fails closed. Add one of
            # (a patch, or an edit of this file):
            # - name: IDP_WEB_PROVIDER
            #   value: exa                         # or brave
            # - name: IDP_WEB_EXA_KEY_FILE         # exa; the Secret idp-web-search-key holds it as exa.key
            #   value: /etc/idp/search/exa.key
            # - name: IDP_WEB_EXA_BASE_URL         # exa only, https only; the EU endpoint is https://api.eu.exa.ai
            #   value: https://api.eu.exa.ai
            # - name: IDP_WEB_BRAVE_KEY_FILE       # brave; the Secret holds it as brave.key
            #   value: /etc/idp/search/brave.key
            # `fixture` (answers from a file, no network) is for development and acceptance and is never a production setting.
            # Never IDP_WEB_TEST_ORIGINS: it exempts addresses from the address rules (ADR-0001 D14), and tests/deploy fails
            # if it is in these files.
          readinessProbe:
            httpGet:
              path: /readyz        # 200 only when the provider, the ref key and the tenants file are loaded and the database answers
              port: ops
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}       # the read cache holds up to 64 MiB of text, a page is read whole before it is cut, and the PDF reader (up to two processes of 192 MiB at once, IDP_WEB_PDF_CONCURRENCY, ADR-0001 D31) is in the same container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: ref-key, mountPath: /etc/idp/ref, readOnly: true}
            - {name: gateway-caller-keys, mountPath: /etc/idp/gateway, readOnly: true}
            - {name: tenants, mountPath: /etc/idp/tenants, readOnly: true}
            - {name: search-key, mountPath: /etc/idp/search, readOnly: true}
            - {name: database, mountPath: /etc/idp/database, readOnly: true}
      volumes:
        - name: ref-key
          secret:
            secretName: idp-web-ref-key               # created by the operator
        - name: gateway-caller-keys
          configMap:
            name: idp-web-gateway-caller-keys         # created by the operator: the gateway's public key is not a secret
        - name: tenants
          configMap:
            name: idp-web-tenants                     # generated by kustomization.yaml from tenants.yaml
        - name: search-key
          secret:
            secretName: idp-web-search-key            # created by the operator, with the provider's key
            optional: true                            # absent until a provider is chosen: the missing provider is the error to see
        - name: database
          secret:
            secretName: idp-web-database              # created by the operator: service-url and ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: idp-web
  namespace: idp-web
  labels:
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: mcp
      port: 8580
      targetPort: mcp
